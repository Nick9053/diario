<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diario</title>
<!-- Ícono que iOS y Android usan al "Agregar a inicio" -->
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="icono-512.png">
<meta name="apple-mobile-web-app-title" content="Diario">
<meta name="theme-color" content="#1F8A5B">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1F8A5B;color:#fff;font:17px/1.4 -apple-system,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  img{width:96px;height:96px;border-radius:22px}
  a{display:inline-block;margin-top:18px;background:#fff;color:#1F8A5B;font-weight:700;padding:14px 22px;border-radius:14px;text-decoration:none}
  p{opacity:.85;max-width:300px;margin:14px auto 0}
</style>
</head>
<body>
<main>
  <img src="icono-512.png" alt="">
  <h1 style="margin:14px 0 0">Diario</h1>
  <a id="ir" href="https://script.google.com/macros/s/AKfycbyr6FJR5ajNrxKjDMd1qB5INGwvK-dvGLn0VF800DmY3aP2RQb0O1y8oCoLkpCjwWDgQg/exec">Abrir mi Diario</a>
  <p id="tip" hidden>Para tenerla como app: toca Compartir y luego "Agregar a inicio". Después ábrela desde el ícono.</p>
</main>
<script>
  // Link para compartir: .../?nuevo  -> muestra cómo agregarla y deja la dirección limpia para el ícono.
  // Desde el ícono (dirección limpia) -> entra directo al Diario.
  const URL_APP = document.getElementById('ir').href;
  if (/nuevo/.test(location.search)) { document.getElementById('tip').hidden = false; history.replaceState(null, '', location.pathname); }
  else { location.replace(URL_APP); }
</script>
</body>
</html>
